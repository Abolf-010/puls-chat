# Example local dependencies — copy to docker-compose.yml if useful
# Usage: docker compose -f docker-compose.example.yml up -d

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Uncomment when you have a working Dockerfile for the Nest app:
  # api:
  #   build: .
  #   ports:
  #     - "3000:3000"
  #   env_file: .env
  #   depends_on:
  #     - mongo
  #     - redis
  #   volumes:
  #     - ./uploads:/app/uploads

volumes:
  mongo_data:
