<body>

<audio id="remoteAudio" autoplay playsinline></audio>
<script src="https://192.168.1.100/socket.io/socket.io.js" ></script>
<script>
    (function () {
      var start = function () {
        var s = document.createElement('script');
        s.src = '/assets/script/main.js'; // or main.ts bundle path
        s.defer = true;
        s.type="module"
        document.body.appendChild(s);
      };

      if (window.__authGatePromise) {
        window.__authGatePromise.then(function (r) {
          if (r && r.ok && !r.redirected) start();
          // if redirected to login, do nothing
        });
      } else {
        // fallback if data-auto missing
        window.__authGate({ mode: 'app' }).then(function (r) {
          if (r && r.ok && !r.redirected) start();
        });
      }
    })();
  </script>

</html>
