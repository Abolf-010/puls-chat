<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chat" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/static/icons/icon-192.png" />
  <title>Chat — Sign in</title>
  <link rel="stylesheet" href="./assets/style/style.css" />
  <link rel="stylesheet" href="./assets/style/login.css" />
  <link rel="stylesheet" href="./assets/style/nebula-tokens.css" />
  <link rel="stylesheet" href="./assets/style/login-nebula.css" />
  <link rel="stylesheet" href="./assets/style/nebula-login.css" />
  <link rel="stylesheet" href="./assets/static/font/font-awesome/css/all.css" />
  <script src="assets/script/auth-gate.js" data-auto="login"></script>
  <script src="assets/script/pwa-register.js" defer></script>
</head>
<body data-page="login">
  <header>
    <h1>Welcome back</h1>
    <p>Sign in to continue</p>
  </header>
  <main id="login">
    <div id="formError" class="form-error" hidden></div>
    <div id="DataCon">
      <input type="text" id="userNameInp" placeholder="Username" autocomplete="off" />
      <input type="password" id="passwordInp" placeholder="Password" autocomplete="off" />
    </div>
    <div id="forgotCon">
      <p>Forgot password?</p>
    </div>
    <div id="signinCon">
      <button type="button">Sign In</button>
    </div>
    <div id="orCon">
      <p>Or continue with</p>
      <div>
        <button type="button" disabled title="Coming soon"><span><i class="fa-brands fa-google"></i></span></button>
        <button type="button" disabled title="Coming soon"><span><i class="fa-brands fa-facebook"></i></span></button>
        <button type="button" disabled title="Coming soon"><span><i class="fa-brands fa-apple"></i></span></button>
      </div>
    </div>
  </main>
  <footer>
    <p>Don&apos;t have an account? <span id="authToggle">Register</span></p>
  </footer>
  <script src="./assets/script/login.js"></script>
</body>
</html>
